services:
  db:
    image: postgres:16-alpine
    container_name: anexa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: anexa
      POSTGRES_PASSWORD: anexa
      POSTGRES_DB: anexa
    ports:
      - "5544:5432"
    volumes:
      - anexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anexa -d anexa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anexa_pgdata:
